[platformio]
default_envs = c3

[env:c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  olikraus/U8g2@^2.35.19
  witnessmenow/UniversalTelegramBot@^1.3.0
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
lib_compat_mode = off

; Hardware test sketches, one per component. See hardware_test/README.md.
; Run: pio run -e hw_<name> -t upload && pio device monitor
[hw_base]
extends = env:c3
test_ignore = *

[env:hw_i2c_scan]
extends = hw_base
build_src_filter = -<*> +<../hardware_test/i2c_scan/>

[env:hw_oled]
extends = hw_base
build_src_filter = -<*> +<../hardware_test/oled/>

[env:hw_reed]
extends = hw_base
build_src_filter = -<*> +<../hardware_test/reed/>

[env:hw_buzzer]
extends = hw_base
build_src_filter = -<*> +<../hardware_test/buzzer/>

[env:hw_wifi_telegram]
extends = hw_base
build_src_filter = -<*> +<../hardware_test/wifi_telegram/>
